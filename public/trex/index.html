<title>Tyrant's Storm</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #05070d;
    --line: #1b2638;
    --rain: #8fa6c6;
    --bolt: #eaf1ff;
    --ember: #ffb347;
    --text: #c3cee0;
    --dim: #6b7a94;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Martian Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
  }
  .wrap {
    min-height: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-inline: 16px;
    padding-block: 16px;
  }
  .stage {
    width: min(100%, calc((100dvh - 170px) * 16 / 9));
    min-width: min(100%, 300px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #05070d;
    outline: 1px solid var(--line);
    cursor: crosshair;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 24px;
  }
  .era {
    margin: 0;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  h1 {
    margin: 0;
    font-family: "Pixelify Sans", "Martian Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: clamp(24px, 3.2vw, 34px);
    line-height: 1.1;
    color: var(--bolt);
    text-wrap: balance;
  }
  h1 span { color: var(--ember); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit;
    font-size: 11px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    padding: 8px 12px;
    cursor: pointer;
    display: inline-flex;
    gap: 10px;
    align-items: center;
  }
  button:hover { border-color: var(--rain); color: var(--bolt); }
  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); }
  kbd {
    font: inherit;
    font-size: 10px;
    color: var(--dim);
    border: 1px solid var(--line);
    padding: 0 5px;
  }
  .note { margin: 0; color: var(--dim); font-size: 11px; max-width: 70ch; }

  /* In the deck: the scene fills the slide, and the title bar and controls give
     way to the slide's own line. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .wrap, .stage { display: block; width: 100%; height: 100%; padding: 0; min-width: 0; }
  canvas { width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; outline: none; cursor: default; }
  .bar, .note { display: none; }
</style>

<div class="wrap">
  <main class="stage">
    <canvas id="scene" width="320" height="180" aria-label="Pixel art: a Tyrannosaurus rex roaring in a rain-soaked night jungle as lightning strikes behind the palms"></canvas>
    <div class="bar">
      <div>
        <p class="era">Hell Creek floodplain · Late Cretaceous · ~66 Ma</p>
        <h1>Tyrant<span>'</span>s Storm</h1>
      </div>
      <div class="controls">
        <button id="btn-bolt" type="button">Call lightning <kbd>L</kbd></button>
        <button id="btn-roar" type="button">Roar <kbd>R</kbd></button>
        <button id="btn-sound" type="button" aria-pressed="false">Sound off <kbd>S</kbd></button>
      </div>
    </div>
    <p class="note">Click the sky to strike anywhere. Everything is drawn live in code, the T-rex included.</p>
  </main>
</div>

<script src="rig.js"></script>
<script>
(() => {

const W = 320, H = 180, GROUND = 156, FEET = 163;
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
let SEED = 20260924;
const rnd = () => ((SEED = (Math.imul(SEED, 1664525) + 1013904223) >>> 0) / 4294967296);
const R = Math.random;
const lerp = (a, b, t) => a + (b - a) * t;
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
const ease = t => t * t * (3 - 2 * t);

// ---------- sky ----------
function stopAt(stops, t) {

  return stops[stops.length - 1][1];
}
function paintSky(stops) {
  const h = GROUND + 4, [c, g] = mk(W, h), im = g.createImageData(W, h), L = 10;
  for (let y = 0; y < h; y++) for (let x = 0; x < W; x++) {
    const t = Math.min(1, y / (GROUND - 24));
    const col = stopAt(stops, Math.min(1, Math.floor(t * L + bay(x, y)) / L));
    const i = (y * W + x) * 4; im.data[i] = col[0]; im.data[i + 1] = col[1]; im.data[i + 2] = col[2]; im.data[i + 3] = 255;
  }

}
const sky = paintSky([[0, hx('#04060c')], [.55, hx('#0a1124')], [1, hx('#1b2744')]]);
const skyLit = paintSky([[0, hx('#2a3663')], [.55, hx('#6577ad')], [1, hx('#b4c3ea')]]);

// ---------- clouds (tileable value noise) ----------
function hash(i, j) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

const dens = (x, y) => fbm(x / 40, y / 14, 16) - (.26 + (y / CH) * .44);
function paintClouds(cols) {
  const [c, g] = mk(CW, CH), im = g.createImageData(CW, CH);
  const C = cols.map(hx);

    const d = dens(x, y); if (d <= 0) continue;
    if (d < .025 && bay(x, y) > d / .025) continue;

    const i = (y * CW + x) * 4; im.data[i] = col[0]; im.data[i + 1] = col[1]; im.data[i + 2] = col[2]; im.data[i + 3] = 255;
  }

}
const clouds = paintClouds(['#070a14', '#0d1325', '#151d35']);
const cloudsLit = paintClouds(['#3a4876', '#6a7cb0', '#b8c6ec']);

// ---------- foliage primitives ----------
function frond(g, x, y, a, len, droop, col, hi, leaf, thick = 1) {

    let tx = ca, ty = sa + 2 * droop * t / len; const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;

}
const crowns = [];

    frond(g, tx, ty, a + (rnd() - .5) * .15, L * (.8 + rnd() * .35), L * .45, pal.leaf, pal.leafHi, Math.max(1, Math.round(L / 5))));

      g.fillRect(cx + x, cy + y, 1, 1);

}

// ---------- back: ridges ----------
const [back, bg] = mk(W, H);
const FAR = '#0a1020', NEAR = '#081013';
const ridge1 = x => 102 + 5 * Math.sin(x * .021 + 1) + 3 * Math.sin(x * .067);
const ridge2 = x => 124 + 4 * Math.sin(x * .03 + 2) + 2 * Math.sin(x * .11);
bg.fillStyle = FAR;
for (let x = 0; x < W; x++) { const y = Math.round(ridge1(x)); bg.fillRect(x, y, 1, GROUND - y + 4); }
for (let x = -4; x < W + 4; x += 4 + rnd() * 5) { const r = 3 + rnd() * 4; blob(bg, x | 0, Math.round(ridge1(x)) + 1, r | 0, FAR, FAR); }
bg.fillStyle = NEAR;
for (let x = 0; x < W; x++) { const y = Math.round(ridge2(x)); bg.fillRect(x, y, 1, GROUND - y + 4); }
for (let x = -4; x < W + 4; x += 3 + rnd() * 4) { const r = 2 + rnd() * 3; blob(bg, x | 0, Math.round(ridge2(x)) + 1, r | 0, NEAR, NEAR); }
const silPal = { trunk: NEAR, trunkHi: NEAR, leaf: NEAR, leafHi: NEAR };
[[30, 22], [96, 16], [214, 20], [236, 14], [292, 24]].forEach(([x, h]) => palm(bg, x, Math.round(ridge2(x)) + 2, h, (rnd() - .5) * 6, 9, silPal, false));

// ---------- ground ----------
const [groundC, gg] = mk(W, H);
for (let y = GROUND; y < H; y++) for (let x = 0; x < W; x++) {
  const n = fbm(x / 9, y / 3, 64);
  gg.fillStyle = n + bay(x, y) * .25 > .62 ? '#0f1b16' : (y > 172 && bay(x, y) < .3 ? '#070d0b' : '#0a130f');
  gg.fillRect(x, y, 1, 1);
}
gg.fillStyle = '#12241c';
for (let i = 0; i < 70; i++) { const x = (rnd() * W) | 0, y = GROUND + ((rnd() * 20) | 0), h = 1 + ((rnd() * 3) | 0); gg.fillRect(x, y - h, 1, h); if (rnd() < .5) gg.fillRect(x + 1, y - h + 1, 1, h - 1); }

// puddles
const PUDDLES = [{ x: 168, y: 168, w: 70, h: 5 }, { x: 250, y: 173, w: 34, h: 3 }, { x: 56, y: 172, w: 30, h: 3 }, { x: 300, y: 165, w: 18, h: 2 }, { x: 96, y: 176, w: 22, h: 2 }];
const puddlePath = new Path2D(), puddleRows = [];
for (const p of PUDDLES) for (let dy = -p.h; dy <= p.h; dy++) {
  const hw = Math.round(p.w / 2 * Math.sqrt(1 - (dy / (p.h + .5)) ** 2)); if (hw < 1) continue;

}
const inPuddle = (x, y) => { x = Math.round(x); y = Math.round(y); return puddleRows.some(r => r[1] === y && x >= r[0] && x < r[0] + r[2]); };

// ---------- mid jungle ----------
const [mid, mg] = mk(W, H);
const junglePal = { trunk: '#0d1a17', trunkHi: '#172b25', leaf: '#0c1f19', leafHi: '#18342b' };
[[104, 50, 4, 16], [62, 72, -7, 22], [14, 94, 10, 27], [262, 80, -12, 24], [304, 100, -4, 28], [226, 46, 3, 15]].forEach(([x, h, l, L]) => palm(mg, x, GROUND + 2, h, l, L, junglePal, true));
for (let x = -8; x < W + 8; x += 5 + rnd() * 6) {
  const clear = x > 120 && x < 214, r = clear ? 2 + rnd() * 2 : 5 + rnd() * 8;
  blob(mg, x | 0, (GROUND + 2 - r * .4) | 0, r | 0, '#0a1814', '#132b23');
}
for (const x of [122, 131, 206, 214]) for (let i = 0; i < 4; i++) frond(mg, x, GROUND + 2, -1.57 + (i - 1.5) * .45, 9 + rnd() * 4, 5, '#0b1c16', '#15302a', 2);
// rim-light mask for lightning
const [midRim, mrg] = mk(W, H);
{
  const src = mg.getImageData(0, 0, W, H).data, im = mrg.createImageData(W, H);
  for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    if (src[i + 3] && !src[i + 3 - W * 4]) { im.data[i] = 150; im.data[i + 1] = 176; im.data[i + 2] = 214; im.data[i + 3] = 255; }
  }
  mrg.putImageData(im, 0, 0);
}

// vignette
const [vig, vg] = mk(W, H);
{ const gr = vg.createRadialGradient(W / 2, H * .55, 60, W / 2, H * .55, 210); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)'); vg.fillStyle = gr; vg.fillRect(0, 0, W, H); }

// ---------- the tyrant (frames drawn by TrexRig) ----------
const K = .8;
const frameCache = { idle: [], roar: [] };
function frameOf(clip, i) {
  let f = frameCache[clip][i];
  if (!f) {
    const raw = TrexRig.render(clip === 'idle' ? TrexRig.idle(i / TrexRig.IDLE.frames) : TrexRig.roar(i / TrexRig.ROAR.fps), K);
    f = frameCache[clip][i] = { night: TrexRig.grade(raw, 'night'), lit: TrexRig.grade(raw, 'lit'), eye: raw.eye, mouth: raw.mouth };
  }
  return f;
}
const heroX = 106, heroY = FEET - Math.floor(TrexRig.GY * K);
const LID = 'rgb(13,32,45)';
(function stampRival() {
  // a second tyrant on the far ridge, facing ours, pure silhouette
  const raw = TrexRig.render(TrexRig.idle(0), .4), d = raw.img.data, w = raw.w;
  const bx = 26, by = Math.round(ridge2(bx + w / 2)) + 2 - raw.ground;
  bg.fillStyle = NEAR;
  for (let y = 0; y < raw.h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3]) bg.fillRect(bx + (w - 1 - x), by + y, 1, 1);
})();

// ---------- world state ----------
let t = 0, last = 0;
const strikes = [], mist = [], birds = [], splashes = [], ripples = [];
let idlePh = 0, blinkT = 2.5, fired = {};
let roarT = null, roarCooldown = 0, pendingRoar = null, nextAuto = 1.1, doubleAt = null, shake = 0, firstStrike = true;

const LAYERS = [
  { n: 110, sp: [150, 190], len: 3, col: '90,108,140', a: .5, land: [GROUND - 2, GROUND + 6] },
  { n: 80, sp: [230, 280], len: 5, col: '118,138,172', a: .6, land: [GROUND + 3, H - 6] },
  { n: 38, sp: [320, 380], len: 8, col: '165,184,214', a: .7, land: [H - 12, H + 2] }
];
const WIND = -.22;
const drops = LAYERS.map((L, li) => Array.from({ length: L.n }, () => newDrop(li, true)));
function newDrop(li, init) {
  const L = LAYERS[li];
  return { x: R() * (W + 50), y: init ? R() * H : -L.len - R() * 30, sp: lerp(L.sp[0], L.sp[1], R()), land: lerp(L.land[0], L.land[1], R()) };
}

function bolt(x0, y0, x1, y1, j) {
  const p = [[x0, y0]]; let x = x0, y = y0;
  while (y < y1 - 1) { const st = 3 + R() * 7; y = Math.min(y1, y + st); x += (R() - .5) * st * 1.6 * j + (x1 - x) * .15; p.push([x, y]); }
  return p;
}
function strike(x) {
  x = x ?? 20 + R() * 280;
  const y1 = 104 + R() * 22, pts = bolt(x + (R() - .5) * 40, 40, x, y1, 1), br = [];
  for (let i = 2; i < pts.length - 2; i++) if (R() < .3) { const [bx, by] = pts[i], dir = R() < .5 ? -1 : 1; br.push(bolt(bx, by, bx + dir * (12 + R() * 30), by + 10 + R() * 26, .8)); }

}
function roar() {

  if (roarT === null && pendingRoar === null) pendingRoar = t;
}
function scatterBirds() {
  for (let i = 0; i < 9; i++) {
    const [cx, cy] = crowns[(R() * crowns.length) | 0];
    birds.push({ x: cx + (R() - .5) * 8, y: cy + R() * 4, vx: (cx < 170 ? -1 : 1) * (26 + R() * 30), vy: -(14 + R() * 20), ph: R() * 6, delay: .1 + R() * .4 });
  }
}
function flick(a) {
  if (reduce) return a < .6 ? .45 * (1 - a / .6) : 0;
  if (a < .05) return 1; if (a < .09) return .15; if (a < .15) return .85; if (a < .2) return .2; if (a < .24) return .6;

}
const roaring = () => roarT !== null && roarT > .85 && roarT < 2.2;
function currentFrame() {
  return roarT !== null
    ? frameOf('roar', Math.min(TrexRig.ROAR.frames - 1, Math.floor(roarT * TrexRig.ROAR.fps)))
    : frameOf('idle', Math.floor(idlePh * TrexRig.IDLE.frames) % TrexRig.IDLE.frames);
}

// ---------- update ----------
function update(dt) {
  t += dt;
  if (t >= nextAuto) { strike(); if (R() < .4) doubleAt = t + .35 + R() * .45; nextAuto = t + 6 + R() * 6; }
  if (doubleAt !== null && t >= doubleAt) { doubleAt = null; strike(); }
  if (pendingRoar !== null && t >= pendingRoar) roar();

  while (strikes.length && strikes[0].age > 1.6) strikes.shift();

  if (roarT === null) {
    const prev = idlePh;
    idlePh = (idlePh + dt / TrexRig.IDLE.period) % 1;
    const crossed = (prev < .5 && idlePh >= .5) || idlePh < prev;

    }
    if (roarT >= TrexRig.ROAR.dur) { roarT = null; roarCooldown = t + 3; idlePh = 0; }
  }

  for (let i = mist.length - 1; i >= 0; i--) { const m = mist[i]; m.age += dt; m.x += m.vx * dt; m.y += m.vy * dt; m.vx *= .98; if (m.age > m.life) mist.splice(i, 1); }
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; if (b.delay > 0) { b.delay -= dt; continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 6 * dt; b.ph += dt * 18;
    if (b.y < -10 || b.x < -10 || b.x > W + 10) birds.splice(i, 1);
  }

  drops.forEach((layer, li) => layer.forEach((d, k) => {
    d.y += d.sp * dt; d.x += WIND * d.sp * dt;
    if (d.y >= d.land) {
      if (li > 0 && d.x > 0 && d.x < W) {
        if (inPuddle(d.x, d.land)) ripples.push({ x: d.x, y: Math.round(d.land), r: 1, age: 0 });
        else for (const dir of [-1, 1]) splashes.push({ x: d.x, y: d.land, vx: dir * (12 + R() * 22), vy: -(22 + R() * 26), age: 0 });
      }
      layer[k] = newDrop(li, false);
    }
  }));
  if (R() < dt * 30) { const p = PUDDLES[(R() * PUDDLES.length) | 0]; const x = p.x + (R() - .5) * p.w * .8, y = p.y + Math.round((R() - .5) * p.h); if (inPuddle(x, y)) ripples.push({ x, y, r: 1, age: 0 }); }
  for (let i = splashes.length - 1; i >= 0; i--) { const s = splashes[i]; s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 320 * dt; if (s.age > .2) splashes.splice(i, 1); }
  for (let i = ripples.length - 1; i >= 0; i--) { const r = ripples[i]; r.age += dt; r.r += 14 * dt; if (r.age > .5) ripples.splice(i, 1); }
}

// ---------- render helpers ----------
function pline(g, x0, y0, x1, y1, w) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1; let err = dx + dy;
  const o = w >> 1;
  for (;;) { g.fillRect(x0 - o, y0 - o, w, w); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function drawPath(g, pts, w) { for (let i = 1; i < pts.length; i++) pline(g, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], w); }
// ---------- render ----------
function render() {
  let F = 0; for (const s of strikes) F = Math.max(F, flick(s.age));
  const fr = currentFrame();
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((R() - .5) * 2 * shake), Math.round((R() - .5) * 2 * shake));
  ctx.fillStyle = '#04060c'; ctx.fillRect(-4, -4, W + 8, H + 8);

  // sky + lightning glow
  ctx.drawImage(sky, 0, 0);
  if (F > 0) {
    ctx.globalAlpha = F * .85; ctx.drawImage(skyLit, 0, 0); ctx.globalAlpha = 1;
    for (const s of strikes) {
      const f = flick(s.age); if (f <= 0) continue;
      const gr = ctx.createRadialGradient(s.x, 100, 0, s.x, 100, 150);
      gr.addColorStop(0, `rgba(190,205,255,${.55 * f})`); gr.addColorStop(1, 'rgba(190,205,255,0)');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, GROUND);
    }
  }
  // bolts (behind clouds so they pour out of the cloud base)
  for (const s of strikes) {
    const f = flick(s.age); if (s.age > .3 || f < .5) continue;
    ctx.fillStyle = 'rgba(120,150,255,.35)'; drawPath(ctx, s.pts, 3); s.br.forEach(b => drawPath(ctx, b, 2));
    ctx.fillStyle = 'rgba(232,240,255,.85)'; s.br.forEach(b => drawPath(ctx, b, 1));
    ctx.fillStyle = '#f4f8ff'; drawPath(ctx, s.pts, 1);
  }
  // clouds
  const off = Math.floor((t * 4) % CW);
  ctx.drawImage(clouds, -off, 0); ctx.drawImage(clouds, CW - off, 0);
  if (F > 0) { ctx.globalAlpha = F; ctx.drawImage(cloudsLit, -off, 0); ctx.drawImage(cloudsLit, CW - off, 0); ctx.globalAlpha = 1; }

  // ridges, ground, jungle
  ctx.drawImage(back, 0, 0);
  ctx.drawImage(groundC, 0, 0);
  ctx.drawImage(mid, 0, 0);
  if (F > 0) { ctx.globalAlpha = F * .8; ctx.drawImage(midRim, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = `rgba(120,140,190,${F * .16})`; ctx.fillRect(0, GROUND, W, H - GROUND); }

  // birds
  ctx.fillStyle = F > .3 ? '#020406' : '#1a2438';
  for (const b of birds) {
    if (b.delay > 0) continue;
    const x = Math.round(b.x), y = Math.round(b.y);
    ctx.fillRect(x, y, 1, 1);
    if (Math.sin(b.ph) > 0) { ctx.fillRect(x - 1, y - 1, 1, 1); ctx.fillRect(x + 1, y - 1, 1, 1); ctx.fillRect(x - 2, y - 1, 1, 1); ctx.fillRect(x + 2, y - 1, 1, 1); }
    else { ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x - 2, y + 1, 1, 1); ctx.fillRect(x + 2, y + 1, 1, 1); }
  }

  // puddles with reflections and ripples
  ctx.save();
  ctx.clip(puddlePath);
  ctx.fillStyle = rgb(mixc(hx('#111a2e'), hx('#9fb2e0'), F * .8)); ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.globalAlpha = .28;
  ctx.save(); ctx.translate(0, 2 * FEET - 1); ctx.scale(1, -1); ctx.drawImage(fr.night, heroX, heroY); ctx.restore();
  ctx.globalAlpha = 1;
  for (const r of ripples) {
    ctx.fillStyle = `rgba(160,180,220,${.55 * (1 - r.age / .5)})`;
    const n = Math.max(6, Math.round(r.r * 5));
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; ctx.fillRect(Math.round(r.x + Math.cos(a) * r.r), Math.round(r.y + Math.sin(a) * r.r * .35), 1, 1); }
  }
  ctx.restore();

  // far rain (behind the tyrant)
  drawRain(0, F);

  // the tyrant
  ctx.drawImage(fr.night, heroX, heroY);
  if (F > 0) { ctx.globalAlpha = F * .85; ctx.drawImage(fr.lit, heroX, heroY); ctx.globalAlpha = 1; }
  if (roarT === null && blinkT < 0) { ctx.fillStyle = LID; ctx.fillRect(heroX + fr.eye[0], heroY + fr.eye[1], 2, 1); }

  // breath steaming in the cold rain
  for (const m of mist) { ctx.fillStyle = `rgba(169,184,212,${.35 * (1 - m.age / m.life)})`; ctx.fillRect(Math.round(m.x), Math.round(m.y), m.s, m.s); }

  drawRain(1, F); drawRain(2, F);
  ctx.fillStyle = `rgba(170,190,220,${.6 + F * .4})`;
  for (const s of splashes) ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);

  // foreground fronds
  const sway = i => .035 * Math.sin(t * 1.1 + i * 1.7) + (roaring() ? .012 * Math.sin(t * 40 + i) : 0);
  const hi = rgb(mixc(hx('#0a1712'), hx('#46685c'), F));
  FG.forEach((f, i) => frond(ctx, f.x, f.y, f.a + sway(i), f.len, f.droop, '#020605', hi, f.leaf, 2));

  ctx.restore();
  if (F > 0) { ctx.fillStyle = `rgba(210,222,255,${F * .1})`; ctx.fillRect(0, 0, W, H); }
  ctx.drawImage(vig, 0, 0);
}
const FG = [
  { x: -4, y: 20, a: .35, len: 70, droop: 26, leaf: 9 }, { x: -6, y: 96, a: .1, len: 54, droop: 18, leaf: 8 }, { x: -2, y: 152, a: -.4, len: 44, droop: 14, leaf: 7 },
  { x: W + 4, y: 28, a: Math.PI - .35, len: 74, droop: 28, leaf: 9 }, { x: W + 6, y: 118, a: Math.PI - .12, len: 50, droop: 16, leaf: 8 }, { x: W + 2, y: 176, a: Math.PI + .45, len: 40, droop: 10, leaf: 7 }
];
function drawRain(li, F) {
  const L = LAYERS[li];
  ctx.fillStyle = `rgba(${L.col},${Math.min(1, L.a + F * .35)})`;
  for (const d of drops[li]) for (let k = 0; k < L.len; k++) ctx.fillRect(Math.round(d.x - WIND * k), Math.round(d.y - k), 1, 1);
}

// ---------- sound ----------
let AC = null, master = null, noiseBuf = null, soundOn = false, roarBuf = null;
function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  // A recorded roar, when it has loaded; the synthesised one stands in until then.
  fetch('roar.mp3').then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).then(b => { roarBuf = b; }).catch(() => {});
  const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.connect(comp);
  // The whole scene fades up with the picture, so the slide opens on a swell.
  master.gain.setValueAtTime(0, AC.currentTime); master.gain.linearRampToValueAtTime(.9, AC.currentTime + .8); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 3, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // The rain is a recording, looped with its seam crossfaded. It is a WAV
  // because an MP3 carries encoder padding, which a looping buffer plays as a
  // gap every lap.
  fetch('rain.wav').then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).then(b => {
    const rec = AC.createBufferSource(), rg = AC.createGain(), now = AC.currentTime;
    rec.buffer = b; rec.loop = true; rg.gain.setValueAtTime(0, now); rg.gain.linearRampToValueAtTime(.55, now + .8);
    rec.connect(rg).connect(master); rec.start();
  }).catch(() => {});
}
function noiseSrc() { const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
function thunderSound(close) {
  if (!soundOn || !AC) return;
  // The rumble follows the flash closely; a far strike still lags, a near one hardly at all.
  const t0 = AC.currentTime + Math.max(0, (1 - close) * 1.3 - .2);
  if (close > .6) {
    const s = noiseSrc(), hp = AC.createBiquadFilter(), g = AC.createGain();
    hp.type = 'highpass'; hp.frequency.value = 1500;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.8, t0 + .005); g.gain.exponentialRampToValueAtTime(.001, t0 + .35);
    s.connect(hp).connect(g).connect(master); s.start(t0, R() * 2); s.stop(t0 + .4);
  }
  const s = noiseSrc(), lp = AC.createBiquadFilter(), g = AC.createGain(), dur = 4 + R() * 2;
  lp.type = 'lowpass'; lp.Q.value = .7; lp.frequency.setValueAtTime(600 + close * 900, t0); lp.frequency.exponentialRampToValueAtTime(90, t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(1.3, t0 + .08);
  for (let tt = t0 + .3; tt < t0 + dur - .5; tt += .2 + R() * .5) g.gain.linearRampToValueAtTime(.35 + R() * .9 * (1 - (tt - t0) / dur), tt);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  s.connect(lp).connect(g).connect(master); s.start(t0, R() * 2); s.stop(t0 + dur + .1);
}
function roarSound() {
  if (!soundOn || !AC) return;
  if (roarBuf) {
    const src = AC.createBufferSource(), g = AC.createGain();
    src.buffer = roarBuf; g.gain.value = .9;
    src.connect(g).connect(master); src.start();
    return;
  }
  const t0 = AC.currentTime + .02, T = 1.9;
  const out = AC.createGain();
  out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(.5, t0 + .3); out.gain.setValueAtTime(.5, t0 + 1.4); out.gain.exponentialRampToValueAtTime(.001, t0 + T);
  const pre = AC.createGain(); pre.gain.value = .6;
  const shaper = AC.createWaveShaper(), curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) curve[i] = Math.tanh((i / 511.5 - 1) * 4); shaper.curve = curve;
  const f1 = AC.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 2.5;
  f1.frequency.setValueAtTime(350, t0); f1.frequency.linearRampToValueAtTime(760, t0 + .4); f1.frequency.linearRampToValueAtTime(520, t0 + 1.8); f1.frequency.linearRampToValueAtTime(300, t0 + T);
  const f0 = AC.createBiquadFilter(); f0.type = 'bandpass'; f0.Q.value = 1.2; f0.frequency.value = 170;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
  [55, 82.5, 41].forEach((f, i) => {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.detune.value = (i - 1) * 14;
    o.frequency.setValueAtTime(f * .8, t0); o.frequency.linearRampToValueAtTime(f * 1.15, t0 + .35); o.frequency.linearRampToValueAtTime(f * .95, t0 + 1.8); o.frequency.linearRampToValueAtTime(f * .7, t0 + T);
    o.connect(pre); o.start(t0); o.stop(t0 + T + .1);
  });
  const n = noiseSrc(), ng = AC.createGain(); ng.gain.value = .5; n.connect(ng).connect(pre); n.start(t0, R() * 2); n.stop(t0 + T + .1);
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 11; lg.gain.value = .2; lfo.connect(lg).connect(out.gain); lfo.start(t0); lfo.stop(t0 + T + .1);
  pre.connect(shaper); shaper.connect(f1).connect(lp); shaper.connect(f0).connect(lp); lp.connect(out).connect(master);
}

// ---------- controls ----------
const btnSound = document.getElementById('btn-sound');
function toggleSound() {
  try {
    if (!AC) initAudio();
    soundOn = !soundOn;
    soundOn ? AC.resume() : AC.suspend();
  } catch (e) { soundOn = false; }
  btnSound.setAttribute('aria-pressed', String(soundOn));
  btnSound.firstChild.textContent = soundOn ? 'Sound on ' : 'Sound off ';
}
btnSound.addEventListener('click', toggleSound);
document.getElementById('btn-bolt').addEventListener('click', () => strike());
document.getElementById('btn-roar').addEventListener('click', roar);
cv.addEventListener('click', e => { const r = cv.getBoundingClientRect(); strike(Math.max(10, Math.min(W - 10, (e.clientX - r.left) / r.width * W))); });
// The slide drives the scene from outside: a roar on its click, lightning on cue.
addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  if (e.data === 'roar') roar(); else if (e.data === 'strike') strike();
  else if (e.data === 'sound') { if (!soundOn) toggleSound(); else if (AC.state === 'suspended') AC.resume(); }
});
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'l') strike(); else if (k === 'r') roar(); else if (k === 's') toggleSound();
});

// ---------- go ----------
// draw one not-yet-cached frame per tick, so the first roar never stalls
let warmI = 0;
function warm() {
  const ni = TrexRig.IDLE.frames, nr = TrexRig.ROAR.frames;
  if (warmI < ni) frameOf('idle', warmI++); else if (warmI < ni + nr) frameOf('roar', warmI++ - ni);
}
function frame(now) {
  const dt = Math.min(.05, last ? (now - last) / 1000 : .016); last = now;
  warm(); update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
